document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

:0;\">Incoming message mapping, case matching and reply-preparation — simulated locally, no live webhook.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:{{ kpiCols }};gap:14px;margin-bottom:20px;\">\n        <sc-for list=\"{{ respondIoSyncCards }}\" as=\"rc\" hint-placeholder-count=\"9\">\n          <div style=\"background:#fff;border:1px solid #E6E0D4;border-radius:14px;padding:16px;\">\n            <div style=\"font-size:11.5px;color:#8A8272;margin-bottom:8px;\">{{ rc.label }}<\u002Fdiv>\n            <span style=\"{{ rc.style }}\">{{ rc.value }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;\">\n        <button style=\"background:#6F8C74;color:#fff;border:none;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;\" sc-camel-on-click=\"{{ importMockRespondIoEvents }}\">Import Mock Respond.io Event(s)<\u002Fbutton>\n        <button style=\"background:none;border:1px solid #E6E0D4;color:#2E2B26;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;\" sc-camel-on-click=\"{{ toggleRespondIoTemplates }}\">{{ showTemplatesLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ hasAmbiguous }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #E3CFA0;border-radius:14px;padding:20px;margin-bottom:20px;\">\n          <div style=\"font-weight:600;color:#7A5C24;margin-bottom:10px;\">Ambiguous Case Matches — Human Selection Required<\u002Fdiv>\n          <sc-for list=\"{{ ambiguousDisplay }}\" as=\"am\" hint-placeholder-count=\"1\">\n            <div style=\"padding:10px 0;border-top:1px solid #EFEBE1;\">\n              <div style=\"font-size:12.5px;color:#453F35;margin-bottom:6px;\">Event {{ am.eventId }} · Contact {{ am.contactNumber }} matches multiple open cases:<\u002Fdiv>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n                <sc-for list=\"{{ am.candidates }}\" as=\"cd\" hint-placeholder-count=\"2\">\n                  <button style=\"background:#fff;border:1px solid #E3CFA0;color:#7A5C24;padding:7px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;\" sc-camel-on-click=\"{{ cd.onClick }}\">Attach to {{ cd.refNo }} ({{ cd.customer }})<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ respondIoValidationSection.hasReport }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background:#fff;border:1px solid #E6E0D4;border-radius:14px;padding:20px;margin-bottom:20px;\">\n          <div style=\"font-weight:600;color:#2E2B26;margin-bottom:12px;\">Respond.io Validation Report<\u002Fdiv>\n          <sc-if value=\"{{ respondIoValidationSection.hasErrors }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12px;font-weight:700;color:#B3261E;margin-bottom:6px;\">Errors<\u002Fdiv>\n            <sc-for list=\"{{ respondIoValidationSection.errors }}\" as=\"e\" hint-placeholder-count=\"1\">\n              <div style=\"font-size:12.5px;color:#B3261E;background:#FBEAEA;border-radius:8px;padding:8px 12px;margin-bottom:6px;\">{{ e }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ respondIoValidationSection.hasWarnings }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12px;font-weight:700;color:#7A5C24;margin:10px 0 6px;\">Warnings<\u002Fdiv>\n            <sc-for list=\"{{ respondIoValidationSection.warnings }}\" as=\"w\" hint-placeholder-count=\"1\">\n              <div style=\"font-size:12.5px;color:#7A5C24;background:#F5EBD8;border-radius:8px;padding:8px 12px;margin-bottom:6px;\">{{ w }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc :1400px;margin:0 auto;padding:{{ pagePadding }};\">\n      <button style=\"background:none;border:none;color:#6E6759;font-size:13px;cursor:pointer;padding:0;margin-bottom:14px;display:flex;align-items:center;gap:6px;\" sc-camel-on-click=\"{{ goToInbox }}\">← Back to Case Inbox<\u002Fbutton>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:20px;\">\n        <div>\n          <div style=\"font-size:12px;color:#8A8272;font-weight:600;margin-bottom:4px;\">{{ selectedCase.id }} · {{ selectedCase.refNo }}<\u002Fdiv>\n          <h1 style=\"font-family:'Lora',serif;font-weight:600;font-size:24px;color:#2E2B26;margin:0 0 6px;\">{{ selectedCase.customer }}<\u002Fh1>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <span style=\"{{ selectedCase.statusStyle }}\">{{ selectedCase.displayStatus }}<\u002Fspan>\n            <span style=\"{{ selectedCase.priorityStyle }}\">{{ selectedCase.priority }} priority<\u002Fspan>\n            <span style=\"{{ selectedCase.riskStyle }}\">{{ selectedCase.riskLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"{{ detailGridStyle }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n\n          <div style=\"background:#fff;border:1px solid #E6E0D4;border-radius:14px;padding:20px;\">\n            <div style=\"font-weight:600;color:#2E2B26;margin-bottom:12px;\">Customer Information<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:{{ infoCols }};gap:12px;font-size:13.5px;\">\n              <div><div style=\"color:#8A8272;font-size:11.5px;margin-bottom:2px;\">Phone<\u002Fdiv><div style=\"color:#2E2B26;\">{{ selectedCase.phone }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"color:#8A8272;font-size:11.5px;margin-bottom:2px;\">Email<\u002Fdiv><div style=\"color:#2E2B26;\">{{ selectedCase.email }}<\u002Fdiv><\u002Fdiv>\n              <div><div 11px;color:#7A5C24;margin-bottom:4px;\">Hold Until / Follow-up Date<\u002Fdiv>\n                  <input type=\"date\" value=\"{{ selectedCase.holdUntil }}\" sc-camel-on-change=\"{{ onHoldFieldChange('until') }}\" style=\"width:100%;padding:8px 10px;border-radius:8px;border:1px solid #E3CFA0;font-size:13px;background:#fff;color:#2E2B26;\">\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11px;color:#7A5C24;margin-bottom:4px;\">Follow-up Owner<\u002Fdiv>\n                  <sc-raw-select value=\"{{ selectedCase.holdOwner }}\" sc-camel-on-change=\"{{ onHoldFieldChange('owner') }}\" style=\"width:100%;padding:8px 10px;border-radius:8px;border:1px solid #E3CFA0;font-size:13px;background:#fff;color:#2E2B26;\">\n                    <option>Brenda<\u002Foption><option>Joe<\u002Foption><option>Faizan<\u002Foption><option>Hazelle<\u002Foption><option>Operations Manager<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11px;color:#7A5C24;margin-bottom:4px;\">Validity Protection Approved<\u002Fdiv>\n                  <sc-raw-select value=\"{{ selectedCase.holdValidityApproved }}\" sc-camel-on-change=\"{{ onHoldFieldChange('validityApproved') }}\" style=\"width:100%;padding:8px 10px;border-radius:8px;border:1px solid #E3CFA0;font-size:13px;background:#fff;color:#2E2B26;\">\n                    <option>No<\u002Foption><option>Yes<\u002Foption>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:11px;color:#7A5C24;margin-bottom:4px;\">Approved By<\u002Fdiv>\n                  <input type=\"text\" placeholder=\"e.g. Sharon\" value=\"{{ selectedCase.holdApprovedBy }}\" sc-camel-on-change=\"{{ onHoldFieldChange('approvedBy') }}\" style=\"width:100%;padding:8px 10px;border-radius:8px;border:1px solid #E3CFA0;font-size:13px;background:#fff;color:#2E2B26;\">\n BG,AMBER)};\n  return {label:'Low',style:pillStyle(SAGE_BG,SAGE_DARK)};\n}\nfunction statusStyle(s){\n  const map={\n    'New':[GRAY_BG,INK_MUTED],'AI Drafted':[SAGE_BG,SAGE_DARK],'Pending Approval':[AMBER_BG,AMBER],\n    'Escalated':[RED_BG,RED],'On Hold':[AMBER_BG,'#7A5C24'],'Approved':[SAGE,'#fff'],'Closed':['#EDEAE2',INK_MUTED]\n  };\n  const c=map[s]||[GRAY_BG,INK_MUTED];\n  return pillStyle(c[0],c[1]);\n}\nfunction labelForSource(source){\n  if(source==='Google Sheets') return 'Case Submission — Google Sheets';\n  if(source==='Manual') return 'Manual Case Entry — CSO Help Desk';\n  return 'Original Message — Respond.io';\n}\n\nconst CATEGORY_RULES = {\n  'Appointment Enquiry': { riskLevel:'Low', safety:false, escalationRequired:false, escalateTo:'', reviewerRole:'Operations Manager / Authorised CSO Reviewer',\n    holdingReply:'', nextAction:'Confirm details directly with customer and update booking records.', missingInfo:[], sensitive:false, escalationReason:'' },\n  'Package / Billing Enquiry': { riskLevel:'Medium', safety:false, escalationRequired:false, escalateTo:'', reviewerRole:'Operations Manager / Authorised CSO Reviewer',\n    holdingReply:'', nextAction:'Verify package/session balance against Google Sheets before responding.', missingInfo:['Order / receipt reference number'], sensitive:false, escalationReason:'' },\n  'Medical / Treatment Suitability': { riskLevel:'High', safety:true, escalationRequired:true, escalateTo:'Hazelle / Centre Manager', reviewerRole:'Hazelle / Centre Manager',\n    holdingReply:\"Thank you for sharing this. We'd like our Centre Manager to review your case before confirming what's suitable, and she may consult your treating therapist. We'll follow up shortly — please don't start any new treatment until we confirm.\",\n    nextAction:'Escalate to Hazelle / Centre Manager for clinical review. Do not provide medical advice.', missingInfo:['Doctor / medical clearance status','Details of any surgical recovery'], sensitive:true,     if(selRaw.displayStatus !== 'Approved'){ this.showToast('Cannot confirm sent — case is not yet Approved.'); this.logChange({field:'respondIoSent',previousValue:'false',newValue:'rejected — not approved',caseRef:selRaw.refNo,source:'Validation'}); return; }\n      if(!(selRaw.finalCustomerReply || draftText).trim()){ this.showToast('Cannot confirm sent — no final reply on record.'); return; }\n      this.setState({ sentOverrides: {...s.sentOverrides, [selRaw.id]: { confirmedBy:'Brenda', confirmedAt:'Just now' }} });\n      this.logChange({ field:'respondIoSent', previousValue:'false', newValue:'true (manually confirmed by Brenda)', caseRef: selRaw.refNo, source:'UI' });\n      this.showToast('Marked as sent — confirmed manually.');\n    };\n\n    const kpis = [\n      { label:'New cases today', value: cases.filter(c=>c.receivedTime.startsWith('Today')).length, color: INK },\n      { label:'Pending approval', value: cases.filter(c=>c.displayStatus==='Pending Approval').length, color: AMBER },\n      { label:'High-risk cases', value: cases.filter(c=>c.riskLevel==='High').length, color: RED },\n      { label:'Escalated cases', value: cases.filter(c=>c.displayStatus==='Escalated').length, color: RED },\n      { label:'On hold', value: cases.filter(c=>c.onHold).length, color: '#7A5C24' },\n      { label:'Avg handling time', value: '2h 40m', color: INK },\n      { label:'Knowledge gaps flagged', value: 2, color: AMBER },\n    ];\n    const kpiCols = isMobile ? 'repeat(2,1fr)' : 'repeat(7,1fr)';\n    const dashCols = isMobile ? '1fr' : '1fr 1fr';\n\n    const repeatedQuestions = [\n      {text:'How many sessions are left in my package?', count:5},\n      {text:'What time slots are available this week?', count:4},\n      {text:'Is it safe to start treatment at X weeks postpartum?', count:3},\n    ];\n    const knowledgeGaps = [\n      'Abdominal binding guidance for C-section clients is not documented in the current SOP.',\n      'Refund/cancellation policy has no documented exception path for Management to reference quickly.',\n    ];\n    const csoNames = ['Brenda','Joe','Faizan'];\n    const csoVolume = csoNames.map(n=>{\n      const count = cases.filter(c=>c.owner===n).length;\n      return { name:n, count, pct: Math.round(count/Math.max(...csoNames.map(x=>cases.filter(c=>c.owner===x).length),1)*100)+'%' };\n    });\n    const cats = [...new Set(cases.map(c=>c.category))];\n    const categoryDist = cats.map(cat=>{\n      const count = cases.filter(c=>c.category===cat).length;\n      return { name:cat, count, pct: Math.round(count/Math.max(...cats.map(x=>cases.filter(c=>c.category===x).length),1)*100)+'%' };\n    });\n\n    // ---- Phase 2A: Google Sheets integration layer (mock, local-only) ----\n    const schemaRows = CASE_FIELD_SCHEMA.map(sc => ({\n      col: sc.col, field: sc.f, type: sc.t, required: sc.req ? 'Required' : 'Optional',\n      integration: sc.iw ? 'Writable' : '—', integrationStyle: sc.iw ? pillStyle(SAGE_BG,SAGE_DARK) : pillStyle(GRAY_BG,'#A8A192'),\n      cso: sc.ue ? 'Editable' : '—', csoStyle: sc.ue ? pillStyle(SAGE_BG,SAGE_DARK) : pillStyle(GRAY_BG,'#A8A192'),\n      engine: sc.comp ? 'Computed' : '—', engineStyle: sc.comp ? pillStyle(AMBER_BG,AMBER) : pillStyle(GRAY_BG,'#A8A192'),\n      def: Array.isArray(sc.def) ? '[]' : String(sc.def), val: sc.val || '—',\n    }));\n    const existingRefNos = new Set(cases.map(c=>c.refNo).filter(Boolean));\n    const vr = s.validationReport;\n    const unsyncedCount = Object.keys(s.unsyncedChangeIds).filter(k=>s.unsyncedChangeIds[k]).length;\n    const syncCards = [\n      { label:'Case Data Source', value:'Local Prototype Data', style: pillStyle(SAGE_BG,SAGE_DARK) },\n      { label:'Google Sheets Read', value:'Not Connected', style: pillStyle(AMBER_BG,AMBER) },\n      { label:'Google Sheets Write', value:'Not Connected', style: pillStyle(AMBER_BG,AMBER) },\n      { label:'Last Mock Import', value: s.sheetSync.lastMockImport || 'Never', style: pillStyle(GRAY_BG,INK_MUTED) },\n      { label:'Last Mock Export', value: s.sheetSync.lastMockExport || 'Never', style: pillStyle(GRAY_BG,INK_MUTED) },\n      { label:'Unsynced Changes', value: String(unsyncedCount), style: unsyncedCount ? pillStyle(AMBER_BG,AMBER) : pillStyle(SAGE_BG,SAGE_DARK) },\n      { label:'Validation Errors', value: String(vr.errors.length), style: vr.errors.length ? pillStyle(RED_BG,RED) : pillStyle(SAGE_BG,SAGE_DARK) },\n    ];\n\n    const importMockRows = () => {\n      const seen = new Set(existingRefNos);\n      const allErrors=[], allWarnings=[], allAutoCorrected=[], newInternalCases=[];\n      MOCK_SHEET_ROWS.forEach((row, idx) => {\n        let canonical = normalizeCase(sheetRowToCase(row));\n        const { errors, warnings, autoCorrected } = validateCase(canonical, seen, row);\n        const tag = `Row ${idx+1}${canonical.refNo ? ' ('+canonical.refNo+')' : ''}`;\n        if(errors.some(e=>e==='Missing Ref No.') || errors.some(e=>e==='Duplicate Ref No.')){\n          allErrors.push(...errors.map(e=>`${tag}: ${e}`)); allWarnings.push(...warnings.map(w=>`${tag}: ${w}`)); return;\n        }\n        seen.add(canonical.refNo);\n        if(!CATEGORY_RULES[canonical.category]) canonical = {...canonical, category:'General Enquiry'};\n        if(!['Low','Medium','High'].includes(canonical.priority)) canonical = {...canonical, priority:'Low'};\n        const internal = canonicalToInternal(canonical, idx);\n        const derived = deriveCase(internal);\n        const flags = detectFlags({...internal, ...derived});\n        const importBlocks = computeImportBlockReasons(internal, derived, flags);\n        if(derived.escalationRequired && !derived.escalateTo) allErrors.push(`${tag}: Missing escalation owner for mandatory escalation`);\n        internal.importedApprovalStatus = canonical.approvalStatus || 'Not Approved';\n        if(canonical.approvalStatus==='Approved' && importBlocks.length){\n          internal.effectiveApprovalStatus = 'Blocked';\n          internal.approvalBlockedReason = importBlocks.join('; ');\n          internal.status = 'Pending Approval';\n          allErrors.push(`${tag}: imported approval status \"Approved\" could not be honoured — mandatory safety/escalation controls take precedence (${importBlocks.join('; ')}). Effective status: Blocked. Imported value preserved for audit.`);\n        } else if(VALID_STATUSES.includes(canonical.status)){\n          internal.effectiveApprovalStatus = canonical.approvalStatus || 'Not Approved';\n          internal.status = canonical.status;\n        }\n        allWarnings.push(...warnings.map(w=>`${tag}: ${w}`));\n        allAutoCorrected.push(...autoCorrected.map(a=>`${tag}: ${a}`));\n        newInternalCases.push(internal);\n      });\n      this.setState({\n        cases: [...s.cases, ...newInternalCases],\n        validationReport: { errors: allErrors, warnings: allWarnings, autoCorrected: allAutoCorrected },\n        sheetSync: { ...s.sheetSync, lastMockImport: 'Just now' },\n      });\n      this.logChange({ field:'import', previousValue:'—', newValue:`Imported ${newInternalCases.length} of ${MOCK_SHEET_ROWS.length} mock rows`, caseRef:'Batch', source:'Mock Sheet Import' });\n      this.showToast(`Imported ${newInternalCases.length} of ${MOCK_SHEET_ROWS.length} mock rows — ${allErrors.length} error(s), ${allWarnings.length} warning(s).`);\n    };\n    const exportMockRows = () => {\n      const rows = cases.map(c => caseToSheetRow(internalToCanonical(c)));\n      this.setState({ sheetSync: { ...s.sheetSync, lastMockExport: 'Just now' }, exportPreviewRows: rows, unsyncedChangeIds: {} });\n      this.logChange({ field:'export', previousValue:'—', newValue:`Exported ${rows.length} case(s) as sheet rows`, caseRef:'Batch', source:'UI' });\n      this.showToast(`Exported ${rows.length} case(s) as mock sheet rows (local only — nothing sent to Google Sheets).`);\n    };\n    const previewMapping = () => this.setState({ mappingPreview: sheetRowToCase(MOCK_SHEET_ROWS[0]), showMappingPreview: !s.showMappingPreview });\n    const toggleUnsyncedPanel = () => this.setState({ showUnsyncedPanel: !s.showUnsyncedPanel });\n\n    const validationSection = {\n      hasErrors: vr.errors.length>0, hasWarnings: vr.warnings.length>0, hasAutoCorrected: vr.autoCorrected.length>0,\n      errors: vr.errors, warnings: vr.warnings, autoCorrected: vr.autoCorrected,\n      hasReport: vr.errors.length+vr.warnings.length+vr.autoCorrected.length>0,\n    };\n    const auditLogDisplay = s.auditLog.map(a => ({ text: `${a.caseRef || 'Case'} · ${a.field}: \"${a.previousValue}\" → \"${a.newValue}\"`, meta: `${a.timestamp} · ${a.changedBy || 'Brenda'} · ${a.source}` }));\n    const unsyncedList = cases.filter(c => s.unsyncedChangeIds[c.id]).map(c => ({ id:c.id, refNo:c.refNo, customer:c.customer, status:c.displayStatus }));\n    const mappingPreviewRows = s.mappingPreview ? Object.entries(s.mappingPreview).filter(([k])=>k!=='extraFields').slice(0,14).map(([k,v])=>({k, v: Array.isArray(v)?(v.length?v.join(', '):'—'): (v===''||v===false?'—':String(v))})) : [];\n    const exportPreviewDisplay = s.exportPreviewRows.slice(0,5).map(row => ({ refNo: row['Ref No.'], customer: row['Customer Name'], category: row['Category'], status: row['Status'], approvalStatus: row['Approval Status'] }));\n\n    // ---- Phase 2B: Respond.io mock event workflow ----\n    const rioVr = s.respondIoValidation;\n    const respondIoSyncCards = [\n      { label:'Respond.io Webhook', value:'Not Connected', style: pillStyle(AMBER_BG,AMBER) },\n      { label:'Incoming Message Sync', value:'Simulated', style: pillStyle(AMBER_BG,AMBER) },\n      { label:'Conversation Lookup', value:'Not Connected', style: pillStyle(AMBER_BG,AMBER) },\n      { label:'Template Sync', value:'Local Registry Only', style: pillStyle(AMBER_BG,AMBER) },\n      { label:'Automatic Send', value:'Disabled', style: pillStyle(RED_BG,RED) },\n      { label:'Manual Copy and Send', value:'Available', style: pillStyle(SAGE_BG,SAGE_DARK) },\n      { label:'Last Mock Event', value: s.respondIoSync.lastMockEvent || 'Never', style: pillStyle(GRAY_BG,INK_MUTED) },\n      { label:'Ambiguous Case Matches', value: String(s.respondIoAmbiguous.length), style: s.respondIoAmbiguous.length ? pillStyle(AMBER_BG,AMBER) : pillStyle(SAGE_BG,SAGE_DARK) },\n      { label:'Respond.io Validation Errors', value: String(rioVr.errors.length), style: rioVr.errors.length ? pillStyle(RED_BG,RED) : pillStyle(SAGE_BG,SAGE_DARK) },\n    ];\n\n    const importMockRespondIoEvents = () => {\n      let workingCases = [...cases];\n      const seenEventIds = new Set(s.respondIoSeenEventIds);\n      const seenMessageIds = new Set(s.respondIoSeenMessageIds);\n      const errors=[], warnings=[], ambiguous=[], newAudit=[];\n      MOCK_RESPONDIO_EVENTS.forEach((raw, idx) => {\n        const event = normalizeRespondIoEvent(raw);\n        const tag = `Event ${idx+1} (${event.eventId||'no id'})`;\n        const v = validateRespondIoEvent(event, seenEventIds, seenMessageIds);\n        if(v.errors.length){ errors.push(...v.errors.map(e=>`${tag}: ${e}`)); warnings.push(...v.warnings.map(w=>`${tag}: ${w}`)); return; }\n        warnings.push(...v.warnings.map(w=>`${tag}: ${w}`));\n        seenEventIds.add(event.eventId); if(event.messageId) seenMessageIds.add(event.messageId);\n        const match = matchEventToCase(event, workingCases);\n        if(match.status==='ambiguous'){\n          ambiguous.push({ event, candidates: match.matches.map(c=>({id:c.id, refNo:c.refNo, customer:c.customer})) });\n          errors.push(`${tag}: Ambiguous Case Match — ${match.matches.map(c=>c.refNo).join(', ')} — human selection required.`);\n          return;\n        }\n        if(match.status==='matched'){\n          const mi = workingCases.findIndex(c=>c.id===match.case.id);\n          workingCases[mi] = mergeRespondIoUpdate(workingCases[mi], event);\n          newAudit.push({ field:'timeline', previousValue:'—', newValue:`Incoming message linked to ${match.case.refNo}`, caseRef: match.case.refNo, source:'Mock Respond.io Event' });\n        } else {\n          const proposed = respondIoEventToCase(event, idx);\n          workingCases.push(proposed);\n          newAudit.push({ field:'case', previousValue:'—', newValue:`Proposed case ${proposed.refNo} created`, caseRef: proposed.refNo, source:'Mock Respond.io Event' });\n        }\n      });\n      this.setState(prev => ({\n        cases: workingCases, respondIoValidation: { errors, warnings }, respondIoAmbiguous: ambiguous,\n        respondIoSeenEventIds: [...seenEventIds], respondIoSeenMessageIds: [...seenMessageIds],\n        respondIoSync: { ...prev.respondIoSync, lastMockEvent: 'Just now' }, auditLog: [...newAudit, ...prev.auditLog].slice(0,60),\n      }));\n      this.showToast(`Processed ${MOCK_RESPONDIO_EVENTS.length} mock event(s) — ${errors.length} error(s), ${warnings.length} warning(s), ${ambiguous.length} ambiguous.`);\n    };\n    const resolveAmbiguousMatch = (eventId, caseId) => () => {\n      const entry = s.respondIoAmbiguous.find(a=>a.event.eventId===eventId);\n      if(!entry) return;\n      const mi = cases.findIndex(c=>c.id===caseId);\n      if(mi<0) return;\n      const updated = [...cases]; updated[mi] = mergeRespondIoUpdate(updated[mi], entry.event);\n      this.setState(prev => ({ cases: updated, respondIoAmbiguous: prev.respondIoAmbiguous.filter(a=>a.event.eventId!==eventId) }));\n      this.logChange({ field:'timeline', previousValue:'—', newValue:`Ambiguous event manually attached to ${updated[mi].refNo}`, caseRef: updated[mi].refNo, source:'UI' });\n      this.showToast(`Event attached to ${updated[mi].refNo}.`);\n    };\n    const toggleRespondIoTemplates = () => this.setState({ showRespondIoTemplates: !s.showRespondIoTemplates });\n\n    const respondIoValidationSection = { hasErrors: rioVr.errors.length>0, hasWarnings: rioVr.warnings.length>0, errors: rioVr.errors, warnings: rioVr.warnings, hasReport: rioVr.errors.length+rioVr.warnings.length>0 };\n    const ambiguousDisplay = s.respondIoAmbiguous.map(a => ({ eventId: a.event.eventId, contactNumber: a.event.contactNumber, candidates: a.candidates.map(c => ({ ...c, onClick: resolveAmbiguousMatch(a.event.eventId, c.id) })) }));\n    const templateRegistryDisplay = TEMPLATE_REGISTRY.map(t => ({ ...t, statusStyle: t.kind==='deprecated' ? pillStyle(RED_BG,RED) : pillStyle(SAGE_BG,SAGE_DARK), kindLabel: ({'approved-reply':'Approved Customer Reply','internal-holding':'Internal Holding Reply','workflow-reminder':'Workflow Reminder','deprecated':'Deprecated'})[t.kind] }));\n\n    const editDraftBtnStyle = `background:${editing?SAGE:'none'};border:1px solid ${SAGE};color:${editing?'#fff':SAGE_DARK};font-size:12.5px;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;`;\n    const approveDisabled = blockReasons.length>0;\n    const approveBtnStyle = approveDisabled\n      ? `background:${GRAY_BG};color:#A8A192;border:none;padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:not-allowed;`\n      : `background:${SAGE};color:#fff;border:none;padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;`;\n\n    return {\n      rootStyle, pagePadding, isMobile, navBtnStyleInbox, navBtnStyleDash, navBtnStyleIntegration, goToInbox, goToDashboard, goToIntegration,\n      toast: s.toast, isInbox: s.view==='inbox', isDashboard: s.view==='dashboard', isDetail: s.view==='detail', isIntegration: s.view==='integration',\n      schemaRows, syncCards, importMockRows, exportMockRows, previewMapping, toggleUnsyncedPanel,\n      validationSection, auditLogDisplay, hasAuditLog: auditLogDisplay.length>0,\n      showMappingPreview: s.showMappingPreview, mappingPreviewRows, hasMappingPreview: mappingPreviewRows.length>0,\n      showUnsyncedPanel: s.showUnsyncedPanel, unsyncedList, hasUnsyncedList: unsyncedList.length>0, noUnsyncedList: unsyncedList.length===0, unsyncedCount,\n      exportPreviewDisplay, hasExportPreview: exportPreviewDisplay.length>0,\n      respondIoSyncCards, importMockRespondIoEvents, respondIoValidationSection, ambiguousDisplay, hasAmbiguous: ambiguousDisplay.length>0,\n      templateRegistryDisplay, toggleRespondIoTemplates, showRespondIoTemplates: s.showRespondIoTemplates,\n      showTemplatesLabel: s.showRespondIoTemplates ? 'Hide Template Registry' : 'View Template Registry',\n      timelineDisplay, hasTimeline: timelineDisplay.length>0,\n      copyDraft, confirmReplySentManually,\n      searchQuery: s.searchQuery, onSearchChange: (e)=>this.setState({searchQuery:e.target.value}),\n      priorityFilters, statusTabs, filteredCases, showDesktopTable: !isMobile,\n      kpis, kpiCols, dashCols, repeatedQuestions, knowledgeGaps, csoVolume, categoryDist,\n      selectedCase, noCaseSelected, riskFlagsAll, customerDataSources, knowledgeHierarchy, integrationStatus, detailGridStyle, infoCols,\n      draftText, draftReadOnly: !editing,\n      draftAreaStyle: `width:100%;min-height:140px;padding:14px 16px;border-radius:10px;border:1px solid ${editing?SAGE:BORDER};background:${editing?'#fff':'#FBFAF7'};font-size:14px;color:${INK};line-height:1.55;resize:vertical;outline:none;`,\n      draftCharCount: draftText.length, onDraftChange: (e)=>setDraft(selRaw.id, e.target.value),\n      toggleEditDraft, editDraftLabel: editing?'Done Editing':'Edit Draft', editDraftBtnStyle, copyDraft,\n      onCategoryChange: (e)=>{ this.setState({categoryOverrides:{...s.categoryOverrides,[selRaw.id]:e.target.value}}); this.logChange({field:'category',previousValue:selRaw.category,newValue:e.target.value,caseRef:selRaw.refNo,source:'Dynamic Rule'}); this.markUnsynced(selRaw.id); },\n      onPriorityChange: (e)=>{ this.setState({priorityOverrides:{...s.priorityOverrides,[selRaw.id]:e.target.value}}); this.logChange({field:'priority',previousValue:selRaw.priority,newValue:e.target.value,caseRef:selRaw.refNo,source:'Dynamic Rule'}); this.markUnsynced(selRaw.id); },\n      approveCase, requestRevision, escalateCase, holdCase, resumeCase, onHoldFieldChange,\n      approveBtnStyle,\n      revisionBtnStyle: `background:none;color:${INK};border:1px solid ${BORDER};padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;`,\n      escalateBtnStyle: `background:${RED_BG};color:${RED};border:none;padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;`,\n      holdBtnStyle: `background:none;color:${INK_MUTED};border:1px solid ${BORDER};padding:11px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;`,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
